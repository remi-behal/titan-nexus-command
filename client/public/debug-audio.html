<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Titan Audio Control Deck</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&family=Share+Tech+Mono&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg-color: #03030c;
                --panel-bg: rgba(6, 6, 20, 0.85);
                --border-color: rgba(0, 243, 255, 0.2);
                --primary: #00f3ff;
                --accent-green: #39ff14;
                --accent-pink: #ff007f;
                --text-glow: 0 0 10px rgba(0, 243, 255, 0.5);
                --green-glow: 0 0 10px rgba(57, 255, 20, 0.5);
                --pink-glow: 0 0 10px rgba(255, 0, 127, 0.5);
            }

            body {
                background-color: var(--bg-color);
                background-image:
                    radial-gradient(at 0% 0%, rgba(255, 0, 127, 0.08) 0, transparent 50%),
                    radial-gradient(at 50% 0%, rgba(0, 243, 255, 0.08) 0, transparent 50%),
                    radial-gradient(at 100% 0%, rgba(57, 255, 20, 0.05) 0, transparent 50%);
                color: #e2e8f0;
                font-family: 'Outfit', sans-serif;
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 2rem;
                box-sizing: border-box;
                overflow-x: hidden;
            }

            /* Scanline CRT overlay */
            body::before {
                content: ' ';
                display: block;
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                right: 0;
                background:
                    linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                    linear-gradient(
                        90deg,
                        rgba(255, 0, 0, 0.06),
                        rgba(0, 255, 0, 0.02),
                        rgba(0, 0, 255, 0.06)
                    );
                z-index: 9999;
                background-size:
                    100% 4px,
                    6px 100%;
                pointer-events: none;
            }

            .terminal-deck {
                background: var(--panel-bg);
                border: 1px solid var(--border-color);
                border-radius: 16px;
                padding: 3rem;
                width: 100%;
                max-width: 900px;
                backdrop-filter: blur(16px);
                box-shadow:
                    0 20px 50px rgba(0, 0, 0, 0.6),
                    inset 0 0 20px rgba(0, 243, 255, 0.05);
                border-top: 2px solid var(--primary);
                position: relative;
            }

            h1 {
                font-family: 'Share Tech Mono', monospace;
                font-size: 2.2rem;
                margin-top: 0;
                margin-bottom: 0.5rem;
                letter-spacing: 4px;
                color: var(--primary);
                text-shadow: var(--text-glow);
                text-align: center;
            }

            .subtitle {
                text-align: center;
                color: #64748b;
                font-size: 0.95rem;
                margin-bottom: 2.5rem;
                text-transform: uppercase;
                letter-spacing: 2px;
            }

            /* Audio Visualizer */
            .visualizer-container {
                width: 100%;
                height: 120px;
                background: rgba(0, 0, 0, 0.5);
                border: 1px solid rgba(0, 243, 255, 0.1);
                border-radius: 8px;
                margin-bottom: 2.5rem;
                overflow: hidden;
                position: relative;
            }

            .visualizer-container::after {
                content: 'SIGNAL ANALYSIS ACTIVE';
                position: absolute;
                top: 10px;
                left: 15px;
                font-family: 'Share Tech Mono', monospace;
                font-size: 0.75rem;
                color: var(--primary);
                opacity: 0.6;
                letter-spacing: 1px;
                animation: blink 2s infinite;
            }

            canvas {
                width: 100%;
                height: 100%;
                display: block;
            }

            /* Tracker Section */
            .tracker-section {
                border: 1px dashed rgba(0, 243, 255, 0.15);
                border-radius: 8px;
                padding: 1.5rem;
                margin-bottom: 2rem;
                background: rgba(0, 0, 0, 0.2);
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1.5rem;
                flex-wrap: wrap;
            }

            .tracker-info {
                display: flex;
                flex-direction: column;
                gap: 0.25rem;
            }

            .tracker-label {
                font-family: 'Share Tech Mono', monospace;
                font-size: 0.8rem;
                color: #64748b;
                letter-spacing: 1px;
            }

            .tracker-value {
                font-family: 'Share Tech Mono', monospace;
                font-size: 1.1rem;
                color: var(--accent-green);
                text-shadow: var(--green-glow);
            }

            /* Sound Grid */
            .sfx-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 1.2rem;
                margin-bottom: 2.5rem;
            }

            .sfx-btn {
                background: rgba(255, 255, 255, 0.02);
                border: 1px solid rgba(255, 255, 255, 0.05);
                border-radius: 12px;
                padding: 1.2rem;
                color: #cbd5e1;
                font-family: 'Share Tech Mono', monospace;
                font-size: 0.95rem;
                font-weight: bold;
                cursor: pointer;
                transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
                position: relative;
                overflow: hidden;
                text-align: left;
            }

            .sfx-btn::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                bottom: 0;
                width: 4px;
                background: var(--primary);
                opacity: 0.5;
                transition: all 0.2s ease;
            }

            .sfx-btn:hover {
                background: rgba(0, 243, 255, 0.04);
                border-color: var(--primary);
                color: #fff;
                transform: translateY(-2px);
                box-shadow: 0 4px 20px rgba(0, 243, 255, 0.15);
            }

            .sfx-btn:hover::before {
                width: 8px;
                opacity: 1;
                box-shadow: var(--text-glow);
            }

            .sfx-btn:active {
                transform: translateY(0);
            }

            .sfx-btn.heavy::before {
                background: var(--accent-pink);
            }
            .sfx-btn.heavy:hover {
                border-color: var(--accent-pink);
                box-shadow: 0 4px 20px rgba(255, 0, 127, 0.15);
            }

            .sfx-btn.green::before {
                background: var(--accent-green);
            }
            .sfx-btn.green:hover {
                border-color: var(--accent-green);
                box-shadow: 0 4px 20px rgba(57, 255, 20, 0.15);
            }

            .btn-desc {
                font-family: 'Outfit', sans-serif;
                font-size: 0.75rem;
                color: #64748b;
                font-weight: normal;
            }

            /* Action Buttons */
            .action-btn {
                background: transparent;
                color: var(--accent-green);
                border: 1px solid var(--accent-green);
                padding: 0.8rem 1.8rem;
                font-family: 'Share Tech Mono', monospace;
                font-size: 0.9rem;
                font-weight: bold;
                border-radius: 8px;
                cursor: pointer;
                transition: all 0.2s ease;
                box-shadow: inset 0 0 10px rgba(57, 255, 20, 0.05);
                text-transform: uppercase;
            }

            .action-btn:hover {
                background: var(--accent-green);
                color: #000;
                box-shadow: var(--green-glow);
            }

            /* Footer Status */
            .footer-status {
                display: flex;
                align-items: center;
                justify-content: space-between;
                border-top: 1px solid rgba(255, 255, 255, 0.05);
                padding-top: 1.5rem;
                font-family: 'Share Tech Mono', monospace;
                font-size: 0.85rem;
                color: #64748b;
            }

            .status-light {
                display: inline-block;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #e2e8f0;
                margin-right: 0.5rem;
                box-shadow: 0 0 8px rgba(226, 232, 240, 0.5);
                animation: pulse 1.5s infinite alternate;
            }

            .status-light.active {
                background: var(--accent-green);
                box-shadow: var(--green-glow);
            }

            @keyframes blink {
                50% {
                    opacity: 0.2;
                }
            }

            @keyframes pulse {
                0% {
                    transform: scale(0.9);
                    opacity: 0.6;
                }
                100% {
                    transform: scale(1.1);
                    opacity: 1;
                }
            }

            @keyframes scan {
                from {
                    top: 0;
                }
                to {
                    top: 100%;
                }
            }
        </style>
    </head>
    <body>
        <div class="terminal-deck">
            <h1>TITAN: AUDIO CONTROL DECK</h1>
            <div class="subtitle">System Diagnostics & SFX Calibration</div>

            <!-- Dynamic Real-time Audio Visualizer -->
            <div class="visualizer-container">
                <canvas id="visualizerCanvas"></canvas>
            </div>

            <!-- Tracker Audio Stream -->
            <div class="tracker-section">
                <div class="tracker-info" style="width: 100%">
                    <span class="tracker-label">TRACKER TRACK</span>
                    <select
                        id="trackSelect"
                        style="
                            background: rgba(0, 0, 0, 0.7);
                            color: var(--accent-green);
                            border: 1px solid var(--border-color);
                            border-radius: 4px;
                            padding: 6px 12px;
                            font-family: 'Share Tech Mono', monospace;
                            font-size: 0.95rem;
                            outline: none;
                            cursor: pointer;
                            margin-top: 5px;
                            width: 100%;
                            box-sizing: border-box;
                        "
                    >
                        <option value="/audio/tracks/twimble.mod">TWIMBLE.MOD (DEFAULT)</option>
                        <option value="/audio/tracks/hackurr_-_banana.xm">BANANA.XM</option>
                    </select>

                    <div
                        style="
                            display: grid;
                            grid-template-columns: repeat(4, 1fr);
                            gap: 6px;
                            margin-top: 8px;
                        "
                    >
                        <button
                            class="action-btn"
                            id="prevBtn"
                            style="padding: 4px 8px; font-size: 0.75rem"
                        >
                            PREV
                        </button>
                        <button
                            class="action-btn"
                            id="playPauseBtn"
                            style="padding: 4px 8px; font-size: 0.75rem"
                        >
                            PAUSE
                        </button>
                        <button
                            class="action-btn"
                            id="nextBtn"
                            style="padding: 4px 8px; font-size: 0.75rem"
                        >
                            NEXT
                        </button>
                        <button
                            class="action-btn"
                            id="shuffleBtn"
                            style="padding: 4px 8px; font-size: 0.75rem"
                        >
                            SHUF
                        </button>
                    </div>
                </div>
                <button class="action-btn" id="playTrackerBtn">START TRACKER</button>
            </div>

            <!-- ZzFX Sound Grid -->
            <div class="sfx-grid"></div>

            <!-- Status Bar -->
            <div class="footer-status">
                <div>
                    <span class="status-light" id="statusLight"></span>
                    <span id="statusText">SYSTEM STANDBY (INTERACTION REQUIRED)</span>
                </div>
                <div>WSL2 REMOTE DEBUGGER PORT: 9222</div>
            </div>
        </div>

        <script type="module">
            import { ChiptuneJsPlayer } from '/node_modules/chiptune3/chiptune3.js';
            import { audioManager } from '/src/utils/AudioManager.js';

            const playTrackerBtn = document.getElementById('playTrackerBtn');
            const trackSelect = document.getElementById('trackSelect');
            const statusLight = document.getElementById('statusLight');
            const statusText = document.getElementById('statusText');
            const canvas = document.getElementById('visualizerCanvas');
            const ctx2d = canvas.getContext('2d');

            let chiptunePlayer = null;
            let audioCtx = null;
            let analyser = null;

            // Initialize Shared AudioContext & AnalyserNode
            async function initAudio() {
                if (audioCtx) return;

                // Initialize AudioManager first to get its shared browser context
                await audioManager.init();
                audioCtx = audioManager.ctx;

                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                analyser.connect(audioCtx.destination);

                statusLight.className = 'status-light active';
                statusText.innerText = 'AUDIO NODE ONLINE';

                // Start visualizer animation loop
                drawVisualizer();
            }

            // Real-time Canvas Waveform Animation
            function drawVisualizer() {
                requestAnimationFrame(drawVisualizer);
                if (!analyser) return;

                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                analyser.getByteTimeDomainData(dataArray);

                // Resize canvas if needed
                if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
                    canvas.width = canvas.clientWidth;
                    canvas.height = canvas.clientHeight;
                }

                ctx2d.fillStyle = 'rgb(3, 3, 12)';
                ctx2d.fillRect(0, 0, canvas.width, canvas.height);

                ctx2d.lineWidth = 2;
                ctx2d.strokeStyle = '#00f3ff';
                ctx2d.beginPath();

                const sliceWidth = canvas.width / bufferLength;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const v = dataArray[i] / 128.0;
                    const y = (v * canvas.height) / 2;

                    if (i === 0) {
                        ctx2d.moveTo(x, y);
                    } else {
                        ctx2d.lineTo(x, y);
                    }

                    x += sliceWidth;
                }

                ctx2d.lineTo(canvas.width, canvas.height / 2);
                ctx2d.stroke();
            }

            // Dynamic hot-swapping when track is changed
            trackSelect.addEventListener('change', () => {
                if (chiptunePlayer) {
                    playTrackerBtn.click();
                }
            });

            // Trigger Tracker music
            playTrackerBtn.addEventListener('click', async () => {
                await initAudio();
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                if (chiptunePlayer) {
                    statusText.innerText = 'TERMINATING ACTIVE TRACKER...';
                    try {
                        chiptunePlayer.stop();
                    } catch (e) {}
                }

                statusText.innerText = 'SPINNING UP TRACK PLAYER...';
                chiptunePlayer = new ChiptuneJsPlayer({
                    context: audioCtx,
                    repeatCount: -1
                });

                // Route chiptune player through visualizer node
                chiptunePlayer.gain.connect(analyser);

                const selectedTrack = trackSelect.value;

                chiptunePlayer.onInitialized(() => {
                    statusText.innerText = 'BUFFERING CHIPTUNE TRACK...';
                    try {
                        chiptunePlayer.load(selectedTrack);
                        statusText.innerText = 'TRACK CONSOLE ACTIVE';
                        playPauseBtn.innerText = 'PAUSE';
                    } catch (err) {
                        statusText.innerText = 'TRACK STREAMING ERROR: ' + err.message;
                    }
                });
            });

            const prevBtn = document.getElementById('prevBtn');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const nextBtn = document.getElementById('nextBtn');
            const shuffleBtn = document.getElementById('shuffleBtn');
            let isShuffle = false;

            playPauseBtn.addEventListener('click', () => {
                if (!chiptunePlayer) return;
                chiptunePlayer.togglePause();
                playPauseBtn.innerText = playPauseBtn.innerText === 'PAUSE' ? 'PLAY' : 'PAUSE';
                statusText.innerText =
                    playPauseBtn.innerText === 'PAUSE' ? 'TRACK PLAYING' : 'TRACK PAUSED';
            });

            const triggerTrackLoad = (path) => {
                trackSelect.value = path;
                playTrackerBtn.click();
            };

            nextBtn.addEventListener('click', () => {
                const options = Array.from(trackSelect.options);
                let nextIdx;
                if (isShuffle) {
                    nextIdx = Math.floor(Math.random() * options.length);
                } else {
                    const currentIdx = trackSelect.selectedIndex;
                    nextIdx = (currentIdx + 1) % options.length;
                }
                triggerTrackLoad(options[nextIdx].value);
            });

            prevBtn.addEventListener('click', () => {
                const options = Array.from(trackSelect.options);
                let prevIdx;
                if (isShuffle) {
                    prevIdx = Math.floor(Math.random() * options.length);
                } else {
                    const currentIdx = trackSelect.selectedIndex;
                    prevIdx = (currentIdx - 1 + options.length) % options.length;
                }
                triggerTrackLoad(options[prevIdx].value);
            });

            shuffleBtn.addEventListener('click', () => {
                isShuffle = !isShuffle;
                shuffleBtn.style.borderColor = isShuffle
                    ? 'var(--accent-green)'
                    : 'var(--border-color)';
                shuffleBtn.style.color = isShuffle ? 'var(--accent-green)' : '';
                shuffleBtn.style.boxShadow = isShuffle ? 'var(--green-glow)' : '';
            });

            // Dynamically build and render all registered sound buttons from JSON
            const grid = document.querySelector('.sfx-grid');
            const registered = audioManager.getRegisteredSounds();

            registered.forEach((sound, idx) => {
                const btn = document.createElement('button');
                btn.className = sound.favorite ? 'sfx-btn green' : 'sfx-btn';
                btn.setAttribute('data-sfx', sound.methodName);

                const numStr = String(idx).padStart(2, '0');
                btn.innerHTML = `
                <span>${numStr}. ${sound.name.toUpperCase()}</span>
                <span class="btn-desc">Procedural dynamic zzfx sound</span>
            `;

                btn.addEventListener('click', async () => {
                    await initAudio();
                    if (audioCtx.state === 'suspended') {
                        await audioCtx.resume();
                    }
                    statusText.innerText = `PLAYING SFX: ${sound.methodName.toUpperCase()}`;
                    const promise = audioManager[sound.methodName]();
                    if (promise) {
                        const bufferSource = await promise;
                        if (bufferSource) {
                            bufferSource.connect(analyser);
                        }
                    }
                });
                grid.appendChild(btn);
            });
        </script>
    </body>
</html>
