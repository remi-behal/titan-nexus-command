<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan Audio Debug System</title>
    <style>
        body {
            background-color: #000;
            color: #00ff44;
            font-family: 'Courier New', monospace;
            padding: 3rem;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            border: 2px solid #333;
            padding: 2rem;
            background: #050505;
        }
        h1 {
            border-bottom: 2px solid #00ff44;
            padding-bottom: 1rem;
            letter-spacing: 2px;
            font-size: 1.5rem;
            text-shadow: 0 0 5px rgba(0, 255, 68, 0.5);
        }
        .btn {
            background: #000;
            color: #00ff44;
            border: 2px solid #00ff44;
            padding: 1.2rem 2.4rem;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 68, 0.2);
            margin: 2rem 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: #00ff44;
            color: #000;
            box-shadow: 0 0 20px #00ff44;
        }
        #status {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #888;
            border-top: 1px solid #222;
            padding-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TITAN: AUDIO DEBUG CONSOLE</h1>
        <button class="btn" id="playBtn">CLAIM SEAT & PLAY TRACK</button>
        <div id="status">STATUS: STANDBY (INTERACTION REQUIRED)</div>
    </div>

    <script type="module">
        import { ChiptuneJsPlayer } from '/node_modules/chiptune3/chiptune3.js';

        const playBtn = document.getElementById('playBtn');
        const status = document.getElementById('status');

        let player = null;
        let ctx = null;

        playBtn.addEventListener('click', async () => {
            if (player) {
                status.innerText = "STATUS: STOPPING PREVIOUS PLAYBACK...";
                try {
                    player.stop();
                } catch(e) {}
            }

            try {
                status.innerText = "STATUS: SPINNING UP AUDIOCONTEXT...";
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                ctx = new AudioCtx();
                
                status.innerText = "STATUS: CONSTRUCTING CHIPTUNE3 MODULES...";
                player = new ChiptuneJsPlayer({
                    context: ctx,
                    repeatCount: -1
                });

                status.innerText = "STATUS: FETCHING TRACK MEMORY...";
                player.load('/audio/tracks/hackurr_-_banana.xm');
                
                status.innerText = "STATUS: PLAYING TACTICAL BACKGROUND MUSIC...";
                playBtn.innerText = "RESTART PLAYBACK";
            } catch (err) {
                console.error(err);
                status.innerText = "ERROR: " + err.message;
            }
        });
    </script>
</body>
</html>
