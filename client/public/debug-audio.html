<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan Audio Control Deck</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #03030c;
            --panel-bg: rgba(6, 6, 20, 0.85);
            --border-color: rgba(0, 243, 255, 0.2);
            --primary: #00f3ff;
            --accent-green: #39ff14;
            --accent-pink: #ff007f;
            --text-glow: 0 0 10px rgba(0, 243, 255, 0.5);
            --green-glow: 0 0 10px rgba(57, 255, 20, 0.5);
            --pink-glow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 0, 127, 0.08) 0, transparent 50%),
                radial-gradient(at 50% 0%, rgba(0, 243, 255, 0.08) 0, transparent 50%),
                radial-gradient(at 100% 0%, rgba(57, 255, 20, 0.05) 0, transparent 50%);
            color: #e2e8f0;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* Scanline CRT overlay */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 9999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .terminal-deck {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 900px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 243, 255, 0.05);
            border-top: 2px solid var(--primary);
            position: relative;
        }

        h1 {
            font-family: 'Share Tech Mono', monospace;
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
            letter-spacing: 4px;
            color: var(--primary);
            text-shadow: var(--text-glow);
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Audio Visualizer */
        .visualizer-container {
            width: 100%;
            height: 120px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 243, 255, 0.1);
            border-radius: 8px;
            margin-bottom: 2.5rem;
            overflow: hidden;
            position: relative;
        }

        .visualizer-container::after {
            content: "SIGNAL ANALYSIS ACTIVE";
            position: absolute;
            top: 10px;
            left: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            color: var(--primary);
            opacity: 0.6;
            letter-spacing: 1px;
            animation: blink 2s infinite;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Tracker Section */
        .tracker-section {
            border: 1px dashed rgba(0, 243, 255, 0.15);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .tracker-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .tracker-label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.8rem;
            color: #64748b;
            letter-spacing: 1px;
        }

        .tracker-value {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            color: var(--accent-green);
            text-shadow: var(--green-glow);
        }

        /* Sound Grid */
        .sfx-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2.5rem;
        }

        .sfx-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.2rem;
            color: #cbd5e1;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
            text-align: left;
        }

        .sfx-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; bottom: 0; width: 4px;
            background: var(--primary);
            opacity: 0.5;
            transition: all 0.2s ease;
        }

        .sfx-btn:hover {
            background: rgba(0, 243, 255, 0.04);
            border-color: var(--primary);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 243, 255, 0.15);
        }

        .sfx-btn:hover::before {
            width: 8px;
            opacity: 1;
            box-shadow: var(--text-glow);
        }

        .sfx-btn:active {
            transform: translateY(0);
        }

        .sfx-btn.heavy::before { background: var(--accent-pink); }
        .sfx-btn.heavy:hover {
            border-color: var(--accent-pink);
            box-shadow: 0 4px 20px rgba(255, 0, 127, 0.15);
        }

        .sfx-btn.green::before { background: var(--accent-green); }
        .sfx-btn.green:hover {
            border-color: var(--accent-green);
            box-shadow: 0 4px 20px rgba(57, 255, 20, 0.15);
        }

        .btn-desc {
            font-family: 'Outfit', sans-serif;
            font-size: 0.75rem;
            color: #64748b;
            font-weight: normal;
        }

        /* Action Buttons */
        .action-btn {
            background: transparent;
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            padding: 0.8rem 1.8rem;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: inset 0 0 10px rgba(57, 255, 20, 0.05);
            text-transform: uppercase;
        }

        .action-btn:hover {
            background: var(--accent-green);
            color: #000;
            box-shadow: var(--green-glow);
        }

        /* Footer Status */
        .footer-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.5rem;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85rem;
            color: #64748b;
        }

        .status-light {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e2e8f0;
            margin-right: 0.5rem;
            box-shadow: 0 0 8px rgba(226, 232, 240, 0.5);
            animation: pulse 1.5s infinite alternate;
        }

        .status-light.active {
            background: var(--accent-green);
            box-shadow: var(--green-glow);
        }

        @keyframes blink {
            50% { opacity: 0.2; }
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        @keyframes scan {
            from { top: 0; }
            to { top: 100%; }
        }
    </style>
</head>
<body>

    <div class="terminal-deck">
        <h1>TITAN: AUDIO CONTROL DECK</h1>
        <div class="subtitle">System Diagnostics & SFX Calibration</div>

        <!-- Dynamic Real-time Audio Visualizer -->
        <div class="visualizer-container">
            <canvas id="visualizerCanvas"></canvas>
        </div>

        <!-- Tracker Audio Stream -->
        <div class="tracker-section">
            <div class="tracker-info">
                <span class="tracker-label">TRACKER TRACK</span>
                <span class="tracker-value" id="trackName">HACKURR - BANANA (STANDBY)</span>
            </div>
            <button class="action-btn" id="playTrackerBtn">START TRACKER</button>
        </div>

        <!-- ZzFX Sound Grid -->
        <div class="sfx-grid">
            <button class="sfx-btn green" data-sfx="roundStart">
                <span>00. ROUND START</span>
                <span class="btn-desc">High fidelity chime ping</span>
            </button>
            <button class="sfx-btn" data-sfx="shoot">
                <span>01. ARCADE SHOOT</span>
                <span class="btn-desc">High-pass standard blip</span>
            </button>
            <button class="sfx-btn heavy" data-sfx="heavyLaunch">
                <span>02. HEAVY LAUNCH</span>
                <span class="btn-desc">Rocket thruster rumbling</span>
            </button>
            <button class="sfx-btn" data-sfx="laser">
                <span>03. PD LASER</span>
                <span class="btn-desc">High pitch sweep chirp</span>
            </button>
            <button class="sfx-btn heavy" data-sfx="explosion">
                <span>04. EXPLOSION</span>
                <span class="btn-desc">Retro white noise crunch</span>
            </button>
            <button class="sfx-btn green" data-sfx="shieldHit">
                <span>05. SHIELD DEFLECT</span>
                <span class="btn-desc">Metallic chime deflection</span>
            </button>
            <button class="sfx-btn heavy" data-sfx="nukeDetonation">
                <span>06. THERMONUCLEAR</span>
                <span class="btn-desc">Massive rumbled decay boom</span>
            </button>
            <button class="sfx-btn" data-sfx="linkSevered">
                <span>07. CABLE SEVERED</span>
                <span class="btn-desc">Snappy energy spark break</span>
            </button>
            <button class="sfx-btn green" data-sfx="structureDestroyed">
                <span>08. OUTPOST COLLAPSE</span>
                <span class="btn-desc">Digital breakdown slide</span>
            </button>
            <button class="sfx-btn" data-sfx="click">
                <span>09. UI CLICK</span>
                <span class="btn-desc">High-pass menu blip pop</span>
            </button>
            <button class="sfx-btn green" data-sfx="seatClaim">
                <span>10. SEAT CLAIM</span>
                <span class="btn-desc">Mechanical lock-in chiptune</span>
            </button>
            <button class="sfx-btn" data-sfx="uplink">
                <span>11. TELEMETRY UPLINK</span>
                <span class="btn-desc">Turn execution ascending sweep</span>
            </button>
            <button class="sfx-btn green" data-sfx="terminalSelect">
                <span>12. TERM SELECT</span>
                <span class="btn-desc">Sci-fi terminal scan chirp</span>
            </button>
            <button class="sfx-btn" data-sfx="linkStage">
                <span>13. LINK STAGING</span>
                <span class="btn-desc">Metallic cable stretching ping</span>
            </button>
            <button class="sfx-btn heavy" data-sfx="actionReset">
                <span>14. RESET BUZZ</span>
                <span class="btn-desc">Descending rejection error buzz</span>
            </button>
            <button class="sfx-btn heavy" data-sfx="structureLanding">
                <span>15. DROP LANDING</span>
                <span class="btn-desc">Orbital landing hydraulic slam</span>
            </button>
        </div>

        <!-- Status Bar -->
        <div class="footer-status">
            <div>
                <span class="status-light" id="statusLight"></span>
                <span id="statusText">SYSTEM STANDBY (INTERACTION REQUIRED)</span>
            </div>
            <div>WSL2 REMOTE DEBUGGER PORT: 9222</div>
        </div>
    </div>

    <script type="module">
        import { ChiptuneJsPlayer } from '/node_modules/chiptune3/chiptune3.js';
        import { zzfx, setZzfxContext } from '/src/utils/ZzFX.js';

        // Sound parameters mapping matching AudioManager exactly
        const sfxParams = {
            roundStart: [0.5, undefined, 150, .4, .1, .2, 1, 1.5, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, .1, .8, .1],
            shoot: [0.2, undefined, 400, .05, undefined, .1, undefined, undefined, 50, -500],
            heavyLaunch: [0.4, undefined, 80, .1, .2, .3, undefined, 1.5, undefined, -5],
            laser: [0.15, undefined, 1200, .01, .05, .05, undefined, undefined, undefined, -20],
            explosion: [0.35, undefined, 100, .05, .1, .3, undefined, 2.5, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, .2, .5],
            shieldHit: [0.25, undefined, 800, .02, undefined, .08, 1, undefined, undefined, undefined, undefined, undefined, undefined, 200, .02],
            nukeDetonation: [0.65, undefined, 45, .2, .4, 1.2, undefined, 3.8, undefined, -1, undefined, undefined, undefined, undefined, undefined, undefined, .3, .2, .5],
            linkSevered: [0.25, undefined, 600, .01, undefined, .15, undefined, 1.2, undefined, -30, 200],
            structureDestroyed: [0.35, undefined, 120, .05, .15, .4, undefined, 1.8, undefined, -8],
            click: [0.1, undefined, 1000, .01, undefined, .04, 1, undefined, undefined, undefined, undefined, undefined, undefined, 100, .05],
            seatClaim: [0.3, undefined, 200, .05, .05, .15, 1, .8, undefined, undefined, undefined, undefined, undefined, 300, .02],
            uplink: [0.25, undefined, 300, .08, .1, .2, 1, 1.2, undefined, 25],
            terminalSelect: [0.12, undefined, 600, .01, .03, .05, undefined, undefined, undefined, 15],
            linkStage: [0.18, undefined, 350, .03, .05, .06, undefined, 0.5, undefined, 5],
            actionReset: [0.2, undefined, 150, .02, .05, .12, undefined, undefined, undefined, -15],
            structureLanding: [0.55, undefined, 65, .08, .12, .35, undefined, 2.2, undefined, -3]
        };

        const playTrackerBtn = document.getElementById('playTrackerBtn');
        const trackName = document.getElementById('trackName');
        const statusLight = document.getElementById('statusLight');
        const statusText = document.getElementById('statusText');
        const canvas = document.getElementById('visualizerCanvas');
        const ctx2d = canvas.getContext('2d');

        let chiptunePlayer = null;
        let audioCtx = null;
        let analyser = null;

        // Initialize Shared AudioContext & AnalyserNode
        function initAudio() {
            if (audioCtx) return;
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContextClass();
            setZzfxContext(audioCtx);

            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            analyser.connect(audioCtx.destination);

            statusLight.className = "status-light active";
            statusText.innerText = "AUDIO NODE ONLINE";

            // Start visualizer animation loop
            drawVisualizer();
        }

        // Real-time Canvas Waveform Animation
        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            if (!analyser) return;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteTimeDomainData(dataArray);

            // Resize canvas if needed
            if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
            }

            ctx2d.fillStyle = 'rgb(3, 3, 12)';
            ctx2d.fillRect(0, 0, canvas.width, canvas.height);

            ctx2d.lineWidth = 2;
            ctx2d.strokeStyle = '#00f3ff';
            ctx2d.beginPath();

            const sliceWidth = canvas.width / bufferLength;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0;
                const y = (v * canvas.height) / 2;

                if (i === 0) {
                    ctx2d.moveTo(x, y);
                } else {
                    ctx2d.lineTo(x, y);
                }

                x += sliceWidth;
            }

            ctx2d.lineTo(canvas.width, canvas.height / 2);
            ctx2d.stroke();
        }

        // Trigger Tracker music
        playTrackerBtn.addEventListener('click', async () => {
            initAudio();
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            if (chiptunePlayer) {
                statusText.innerText = "TERMINATING ACTIVE TRACKER...";
                try {
                    chiptunePlayer.stop();
                } catch(e) {}
            }

            statusText.innerText = "SPINNING UP TRACK PLAYER...";
            chiptunePlayer = new ChiptuneJsPlayer({
                context: audioCtx,
                repeatCount: -1
            });

            // Route chiptune player through visualizer node
            chiptunePlayer.gain.connect(analyser);

            chiptunePlayer.onInitialized(() => {
                statusText.innerText = "BUFFERING CHIPTUNE TRACK...";
                try {
                    chiptunePlayer.load('/audio/tracks/hackurr_-_banana.xm');
                    trackName.innerText = "HACKURR - BANANA.XM (PLAYING)";
                    statusText.innerText = "TRACK CONSOLE ACTIVE";
                } catch (err) {
                    statusText.innerText = "TRACK STREAMING ERROR: " + err.message;
                }
            });
        });

        // Trigger individual ZzFX procedural sound effects
        document.querySelectorAll('[data-sfx]').forEach(button => {
            button.addEventListener('click', async () => {
                initAudio();
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                const sfxKey = button.getAttribute('data-sfx');
                const params = sfxParams[sfxKey];

                statusText.innerText = `PLAYING SFX ID: ${sfxKey.toUpperCase()}`;

                // Play sound effect, routing its source source through visualizer
                const bufferSource = zzfx(...params);
                if (bufferSource) {
                    bufferSource.connect(analyser);
                }
            });
        });
    </script>
</body>
</html>
